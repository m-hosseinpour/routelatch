name: Bug report
description: Report a reproducible defect in RouteLatch
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste real share links, subscription URLs, credentials,
        destination lists or private machine paths. Replace them with synthetic
        equivalents. Security issues must go through a private advisory, not
        this form; see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The observed behaviour, including the exact command and the output or exit code.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: The documented behaviour you expected, with a pointer to the doc if you have one.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Smallest sequence that reproduces the problem.
      placeholder: |
        1. routelatch run --data-dir ...
        2. routelatch import file ...
        3. routelatch rules add ...
        4. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: RouteLatch version
      description: Output of `routelatch version` (version, commit and build date).
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Distribution, kernel, architecture, and desktop session if relevant (for example KDE Plasma on Wayland).
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Relevant output of `routelatch status` or `routelatch doctor`, with secrets and destinations removed.
    validations:
      required: false
