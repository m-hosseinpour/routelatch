name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: Build, vet and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the Go version pinned in go.mod
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download pinned modules
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        # The gated real-systemd and real-desktop checks stay skipped: a hosted
        # runner has no desktop session and installing a user service is not
        # part of CI. Set ROUTELATCH_SYSTEMD_TEST or ROUTELATCH_DESKTOP_TEST
        # only on an authorized machine.
        run: go test -count=1 ./...

  cross-build:
    name: Cross-build linux/${{ matrix.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, riscv64, ppc64le]
    env:
      CGO_ENABLED: "0"
      GOOS: linux
      GOARCH: ${{ matrix.arch }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the Go version pinned in go.mod
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build every package for ${{ matrix.arch }}
        run: go build ./...

      - name: Build the ${{ matrix.arch }} binary
        run: go build -trimpath -buildvcs=false -o "dist/routelatch-linux-${{ matrix.arch }}" ./cmd/routelatch

      - name: Check the artifact architecture
        run: |
          file "dist/routelatch-linux-${{ matrix.arch }}"
          case "${{ matrix.arch }}" in
            arm64) pattern='ARM aarch64' ;;
            riscv64) pattern='UCB RISC-V' ;;
            ppc64le) pattern='64-bit PowerPC' ;;
            *) echo "unexpected architecture"; exit 1 ;;
          esac
          file "dist/routelatch-linux-${{ matrix.arch }}" | grep -q "$pattern"

  packages:
    name: Build and validate tarballs, .deb packages and RPM specs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CGO_ENABLED: "0"
      # Both formats normalise this once to the SAME Version string:
      # v0.0.0-ci -> 0.0.0.ci (leading v stripped, hyphens become dots).
      VERSION: v0.0.0-ci
      COMMIT: ${{ github.sha }}
      SOURCE_DATE_EPOCH: "1700000000"
      REQUIRE_DEB: "1"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the Go version pinned in go.mod
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build all architectures
        run: scripts/build.sh

      - name: Check the amd64 artifact
        run: scripts/check-artifact.sh

      - name: Package tarballs and .deb files
        run: scripts/package.sh

      - name: Validate package metadata, payload and checksums
        run: scripts/check-package.sh

      - name: Assert .deb and RPM specs share one unified version
        run: |
          set -eu
          deb=$(find dist/packages -maxdepth 1 -name '*.deb' | sort | head -1)
          deb_version=$(dpkg-deb -f "$deb" Version)
          for spec in dist/packages/*.spec; do
            spec_version=$(sed -n 's/^Version:[[:space:]]*//p' "$spec")
            [ "$spec_version" = "$deb_version" ] || {
              echo "unified version mismatch: $deb_version (.deb) vs $spec_version ($spec)"
              exit 1
            }
          done
          echo "unified package version: $deb_version"

      - name: Check packaging is reproducible
        run: |
          cp dist/packages/SHA256SUMS /tmp/SHA256SUMS.first
          scripts/package.sh
          diff -u /tmp/SHA256SUMS.first dist/packages/SHA256SUMS

      - name: Upload tarballs, .deb files and RPM specs
        uses: actions/upload-artifact@v4
        with:
          name: routelatch-packages
          path: |
            dist/packages/*.tar.gz
            dist/packages/*.deb
            dist/packages/*.spec
            dist/packages/SHA256SUMS
          if-no-files-found: error

  rpm-packages:
    name: Build and inspect RPM packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CGO_ENABLED: "0"
      VERSION: v0.0.0-ci
      COMMIT: ${{ github.sha }}
      SOURCE_DATE_EPOCH: "1700000000"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the Go version pinned in go.mod
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The local host has no rpm tooling and does not build binary RPMs; these
      # generated specs are the RPM artifacts checked by scripts/check-package.sh.
      # This job is the only place a real RPM is built, so it needs rpmbuild/rpm.
      - name: Install RPM tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
          command -v rpmbuild >/dev/null
          command -v rpm >/dev/null

      - name: Build binaries, specs and static package checks
        run: |
          scripts/build.sh
          scripts/package.sh
          scripts/check-package.sh

      - name: Build and inspect binary RPMs from the generated specs
        run: |
          set -eu
          # The generated spec already carries the one unified version; do not
          # re-derive it here (that would miss the 0.0.0+ prefix rule).
          expected_version=$(sed -n 's/^Version:[[:space:]]*//p' dist/packages/routelatch-x86_64.spec)
          top="$PWD/rpmbuild-verify"
          mkdir -p "$top"/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cp dist/packages/*.tar.gz "$top/SOURCES/"
          for arch in amd64 arm64 riscv64 ppc64le; do
            case "$arch" in
              amd64) rpm_arch=x86_64 ;;
              arm64) rpm_arch=aarch64 ;;
              *) rpm_arch="$arch" ;;
            esac
            cp "dist/packages/routelatch-$rpm_arch.spec" "$top/SPECS/"
            SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" \
              rpmbuild --define "_topdir $top" --target "$rpm_arch" \
              -bb "$top/SPECS/routelatch-$rpm_arch.spec"
          done

          cat >"$top/expected-files" <<'EOF'
          /usr/bin/routelatch
          /usr/lib/systemd/user/routelatch.service
          /usr/share/doc/routelatch/BUILD-INFO
          /usr/share/doc/routelatch/INSTALL.md
          /usr/share/doc/routelatch/PACKAGE-NOTES
          /usr/share/doc/routelatch/README.md
          /usr/share/doc/routelatch/SERVICE.md
          /usr/share/doc/routelatch/THIRD-PARTY-NOTICES.md
          /usr/share/doc/routelatch/docs/licensing.md
          /usr/share/doc/routelatch/go.sum
          /usr/share/licenses/routelatch/LICENSE
          /usr/share/licenses/routelatch/NOTICE
          EOF
          sort -o "$top/expected-files" "$top/expected-files"
          count=0
          for f in $(find "$top/RPMS" -name '*.rpm' | sort); do
            count=$((count + 1))
            echo "== $(basename "$f") =="
            [ "$(rpm -qp --qf '%{NAME}' "$f")" = routelatch ] || { echo "wrong RPM name"; exit 1; }
            [ "$(rpm -qp --qf '%{VERSION}' "$f")" = "$expected_version" ] || {
              echo "wrong RPM version: $(rpm -qp --qf '%{VERSION}' "$f")"; exit 1; }
            [ "$(rpm -qp --qf '%{RELEASE}' "$f")" = 1 ] || { echo "wrong RPM release"; exit 1; }
            [ "$(rpm -qp --qf '%{LICENSE}' "$f")" = Apache-2.0 ] || { echo "wrong RPM license"; exit 1; }
            case "$(rpm -qp --qf '%{ARCH}' "$f")" in
              x86_64 | aarch64 | riscv64 | ppc64le) ;;
              *) echo "unexpected RPM arch"; exit 1 ;;
            esac
            rpm -qR "$f" | grep -Fxq ca-certificates || { echo "missing ca-certificates"; exit 1; }
            rpm -qpl "$f" | sort | diff -u "$top/expected-files" - ||
              { echo "unexpected RPM payload layout"; exit 1; }
            scripts_out=$(rpm -qp --scripts "$f")
            if printf '%s\n' "$scripts_out" | grep -Eq '^(preinstall|postinstall|preuninstall|postuninstall) scriptlet'; then
              echo "RPM has maintainer scriptlets"; exit 1
            fi
            echo "RPM $(basename "$f") inspected: version/arch/license/requires/layout/scripts OK"
          done
          [ "$count" -eq 4 ] || { echo "expected 4 RPMs, built $count"; exit 1; }
          ( cd "$top/RPMS" && sha256sum $(find . -name '*.rpm' | sort) > SHA256SUMS )
          echo "wrote $top/RPMS/SHA256SUMS"

      - name: Upload binary RPMs
        uses: actions/upload-artifact@v4
        with:
          name: routelatch-rpms
          path: |
            rpmbuild-verify/RPMS/**/*.rpm
            rpmbuild-verify/RPMS/SHA256SUMS
          if-no-files-found: error
